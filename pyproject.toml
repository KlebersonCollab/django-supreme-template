[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-supreme-template"
version = "0.1.0"
description = "Django project template with modern Python tooling"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["django", "web", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
]

dependencies = [
    "django>=5.2.0",
    "djangorestframework>=3.15.0",
    "djangorestframework-simplejwt>=5.3.0",
    "django-allauth>=0.57.0",
    "django-jazzmin>=2.6.0",
    "requests>=2.31.0",  # Required by django-allauth
    "cryptography>=42.0.0",  # Required by django-allauth for OAuth providers
    "django-storages>=1.14.0",  # Cloud storage backends
    "boto3>=1.34.0",  # AWS S3 and S3-compatible (DigitalOcean, etc.)
    "google-cloud-storage>=2.14.0",  # Google Cloud Storage
    "azure-storage-blob>=12.19.0",  # Azure Blob Storage
    "django-cors-headers>=4.3.0",  # CORS support for APIs
    "drf-spectacular>=0.27.0",  # OpenAPI 3 schema generation
    "gunicorn>=21.2.0",  # Production WSGI server
    "sentry-sdk>=2.0.0",  # Error tracking and monitoring (optional)
    "django-db-connection-pool>=1.1.5",  # Database connection pooling (optional)
    # Secrets Management (optional - install as needed)
    # "boto3>=1.34.0",  # Already included for S3, also used for AWS Secrets Manager
    # "google-cloud-secret-manager>=2.18.0",  # GCP Secret Manager
    # "azure-keyvault-secrets>=4.8.0",  # Azure Key Vault
    # "azure-identity>=1.15.0",  # Azure authentication
    # "hvac>=2.0.0",  # HashiCorp Vault
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-django>=4.8.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "django-stubs>=4.2.0",
]

[project.urls]
Homepage = "https://github.com/kleberson/django-supreme-template"
Repository = "https://github.com/kleberson/django-supreme-template"
"Bug Tracker" = "https://github.com/kleberson/django-supreme-template/issues"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"*/migrations/*" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "django.*",
    "*.migrations.*",
]
ignore_missing_imports = true

[tool.setuptools]
packages = ["config"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=config",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=63",
]

